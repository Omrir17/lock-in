name: Deploy Lock-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CI: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -z "${!n}" ] && missing="$missing $n"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - run: npm ci
      - name: Type-check worker
        run: npx tsc -p worker --noEmit
      - name: Build app
        run: npm run build
      - name: Database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "lock-in") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create lock-in
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "lock-in") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Could not create or find the D1 database"; exit 1; }
          sed -i "s/__D1_ID__/$id/" wrangler.jsonc
          npx wrangler d1 migrations apply lock-in --remote
      - name: Deploy worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          have=$(npx wrangler secret list 2>/dev/null || echo '[]')
          if ! echo "$have" | grep -q VAPID_PUBLIC_KEY; then
            node -e "
              const c = require('crypto');
              const k = c.generateKeyPairSync('ec', { namedCurve: 'P-256' });
              const pub = k.publicKey.export({ format: 'jwk' }), priv = k.privateKey.export({ format: 'jwk' });
              const raw = Buffer.concat([Buffer.from([4]), Buffer.from(pub.x, 'base64url'), Buffer.from(pub.y, 'base64url')]).toString('base64url');
              require('fs').writeFileSync('vapid.json', JSON.stringify({ VAPID_PUBLIC_KEY: raw, VAPID_PRIVATE_KEY: priv.d }));"
            npx wrangler secret bulk vapid.json
            rm vapid.json
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          else
            echo "::warning::OPENAI_API_KEY secret is not set; the coach will not answer"
          fi
      - name: Summary
        run: echo "Lock-in is live at ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
